services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cleanpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cleanpro_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-cleanpro_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanpro -d cleanpro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build: .
    env_file:
      - .env.example
    command: ["pytest", "--cov=src", "--cov-report=term-missing", "--cov-fail-under=80"]
    depends_on:
      - db
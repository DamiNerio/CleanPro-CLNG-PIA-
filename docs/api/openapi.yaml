openapi: 3.0.3
info:
  title: CleanPro - API de Lógica de Negocios (PIA CLNG)
  description: >-
    Especificación OpenAPI para el sistema de gestión integral de servicios de limpieza CleanPro (Caso 12).
    Implementa Domain-Driven Design (DDD), patrón Specification y patrón State Machine para cotización,
    programación, asignación de cuadrillas, ejecución, excepciones y facturación.
  version: 1.0.0
  contact:
    name: Equipo 12 - FIME UANL
    url: https://github.com/DamiNerio/CleanPro-CLNG-PIA-

servers:
  - url: http://localhost:8000
    description: Servidor de desarrollo local / Docker Compose
  - url: https://cleanpro-pia-clng.onrender.com
    description: Servidor de producción (Demo en vivo)

tags:
  - name: 1. Cotización
    description: Solicitud de cotización, cálculo de recursos, descuentos (RN-01) y aceptación (US-01 a US-05)
  - name: 2. Programación y Asignación
    description: Agendamiento de órdenes y asignación de cuadrillas sin traslapes (US-06 a US-08)
  - name: 3. Ejecución
    description: Registro de inicio/término, evidencia digital de incidencias y firma de conformidad (US-09 a US-11)
  - name: 4. Administración y Reportes
    description: Vinculación con facturación (RN-09), cambios de nómina y tablero de KPIs gerenciales (US-17 a US-19)

paths:
  /api/cotizaciones:
    post:
      tags:
        - 1. Cotización
      summary: Crear solicitud de cotización y sugerir recursos (US-01, US-02)
      description: >-
        Registra una nueva cotización para un prospecto o cliente, calcula automáticamente las horas-persona
        y el personal estimado según la superficie y extras, y evalúa los límites del coordinador (RN-02: <= 300 m2 y <= $8,000 MXN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCotizacionDTO'
      responses:
        '200':
          description: Cotización generada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResponse'
        '400':
          description: Violación de invariante de dominio (campos vacíos o superficie <= 0)

  /api/cotizaciones/{folio}/descuento:
    patch:
      tags:
        - 1. Cotización
      summary: Aplicar porcentaje de descuento a una cotización (US-03, RN-01)
      description: >-
        Evalúa mediante DescuentoAutorizablePorCoordinadorSpec si el rol coordinador puede aplicar el descuento (<= 10%).
        Si supera el 10%, transiciona el estado a 'Pendiente de autorización' y solicita aprobación de gerencia.
      parameters:
        - name: folio
          in: path
          required: true
          schema:
            type: string
          example: COT-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescuentoDTO'
      responses:
        '200':
          description: Descuento aplicado correctamente dentro del límite permitido
        '403':
          description: Descuento > 10% bloqueado para coordinador; requiere autorización de gerencia (RN-01)
        '404':
          description: Cotización no encontrada

  /api/cotizaciones/{folio}/autorizar:
    post:
      tags:
        - 1. Cotización
      summary: Autorizar cotización por parte de Gerencia (US-04, RN-01, RN-02)
      description: >-
        Cambia el estado de la cotización de 'Pendiente de autorización' a 'Autorizada' mediante CotizacionStateMachine.
      parameters:
        - name: folio
          in: path
          required: true
          schema:
            type: string
          example: COT-1001
        - name: usuario_gerencia
          in: query
          required: false
          schema:
            type: string
            default: Lic. Renata Cárdenas
      responses:
        '200':
          description: Cotización autorizada por gerencia
        '400':
          description: Transición de estado inválida
        '404':
          description: Cotización no encontrada

  /api/cotizaciones/{folio}/aceptar:
    post:
      tags:
        - 1. Cotización
      summary: Aceptar cotización por el cliente y generar Orden de Servicio (US-05, RN-09)
      description: >-
        Transiciona la cotización a 'Aceptada' (inmutable) y emite el evento CotizacionAceptada
        para crear automáticamente la Orden de Servicio asociada.
      parameters:
        - name: folio
          in: path
          required: true
          schema:
            type: string
          example: COT-1001
      responses:
        '200':
          description: Cotización aceptada y Orden de Servicio creada
        '400':
          description: La cotización está pendiente de autorización o en un estado inválido
        '404':
          description: Cotización no encontrada

  /api/ordenes/{folio_orden}/programar:
    post:
      tags:
        - 2. Programación y Asignación
      summary: Programar fecha/hora y asignar cuadrilla disponible (US-06, US-07)
      description: >-
        Verifica mediante CuadrillaDisponibleSpec que no existan traslapes de horario y cambia el estado
        de la orden a 'Programada'.
      parameters:
        - name: folio_orden
          in: path
          required: true
          schema:
            type: string
          example: SRV-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramacionDTO'
      responses:
        '200':
          description: Servicio agendado y cuadrilla asignada sin traslape
        '404':
          description: Orden de servicio no encontrada
        '409':
          description: Conflicto de horario por traslape de la cuadrilla seleccionada

  /api/ordenes/{folio_orden}/iniciar:
    post:
      tags:
        - 3. Ejecución
      summary: Registrar hora de inicio del servicio en sitio (US-09)
      description: >-
        Toma la marca de tiempo del sistema y transiciona la orden al estado 'En ejecución'.
      parameters:
        - name: folio_orden
          in: path
          required: true
          schema:
            type: string
          example: SRV-1001
      responses:
        '200':
          description: Inicio de servicio registrado con hora del sistema
        '400':
          description: Transición inválida en OrdenServicioStateMachine

  /api/ordenes/{folio_orden}/incidencias:
    post:
      tags:
        - 3. Ejecución
      summary: Documentar incidencia con evidencia fotográfica (US-10)
      description: >-
        Registra una incidencia ligada a la orden de servicio con tipo, descripción y fotografías.
      parameters:
        - name: folio_orden
          in: path
          required: true
          schema:
            type: string
          example: SRV-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidenciaDTO'
      responses:
        '200':
          description: Incidencia registrada correctamente
        '400':
          description: Datos de incidencia incompletos

  /api/ordenes/{folio_orden}/cerrar:
    post:
      tags:
        - 3. Ejecución
      summary: Cerrar servicio con firma digital y generar registro facturable (US-11, US-18, RN-09)
      description: >-
        Valida que exista hora de inicio (CA-09.2) y que todas las incidencias tengan descripción y foto (CA-10.4).
        Almacena la firma de conformidad o inconformidad y genera automáticamente el registro facturable.
      parameters:
        - name: folio_orden
          in: path
          required: true
          schema:
            type: string
          example: SRV-1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CierreDTO'
      responses:
        '200':
          description: Servicio cerrado y vinculado a facturación
        '400':
          description: Bloqueo por falta de hora de inicio, incidencia sin descripción o inconformidad sin motivo

  /api/administracion/kpis:
    get:
      tags:
        - 4. Administración y Reportes
      summary: Consultar indicadores gerenciales, facturación pendiente y cambios de nómina (US-17, US-18, US-19)
      responses:
        '200':
          description: Resumen de indicadores operativos y administrativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KPIsResponse'

components:
  schemas:
    ExtraInput:
      type: object
      properties:
        horas:
          type: number
          example: 1.0
        costo:
          type: number
          example: 450.0

    SolicitudCotizacionDTO:
      type: object
      required:
        - cliente_nombre
        - datos_contacto
        - ubicacion
        - tipo_inmueble
        - superficie_m2
        - frecuencia
      properties:
        cliente_nombre:
          type: string
          example: Empresa Alfa S.A.
        datos_contacto:
          type: string
          example: contacto@alfa.com
        ubicacion:
          type: string
          example: Av. Universidad, San Nicolás
        tipo_inmueble:
          type: string
          example: oficina
        superficie_m2:
          type: number
          example: 240.0
        frecuencia:
          type: string
          example: quincenal
        extras:
          type: array
          items:
            $ref: '#/components/schemas/ExtraInput'
        canal_origen:
          type: string
          default: web
          example: web

    CotizacionResponse:
      type: object
      properties:
        folio:
          type: string
          example: COT-1001
        estado:
          type: string
          example: Borrador
        subtotal:
          type: number
          example: 6450.0
        total:
          type: number
          example: 6450.0
        horas_persona_sugeridas:
          type: number
          example: 5.0
        personal_sugerido:
          type: integer
          example: 2

    DescuentoDTO:
      type: object
      required:
        - porcentaje
        - rol
        - usuario
      properties:
        porcentaje:
          type: number
          example: 8.0
        rol:
          type: string
          example: coordinador
        usuario:
          type: string
          example: coord_camila
        motivo:
          type: string
          default: Contrato de frecuencia

    ProgramacionDTO:
      type: object
      required:
        - fecha_inicio_iso
        - id_cuadrilla
      properties:
        fecha_inicio_iso:
          type: string
          format: date-time
          example: '2026-11-20T09:00:00'
        id_cuadrilla:
          type: string
          example: C-05

    IncidenciaDTO:
      type: object
      required:
        - tipo
        - descripcion
        - fotos
      properties:
        tipo:
          type: string
          example: daño en mobiliario
        descripcion:
          type: string
          example: Persiana dañada en sala de juntas
        fotos:
          type: array
          items:
            type: string
          example:
            - https://cleanpro.mx/evidencias/foto1.jpg

    CierreDTO:
      type: object
      required:
        - nombre_firmante
        - conformidad
      properties:
        nombre_firmante:
          type: string
          example: Ing. Roberto Garza
        conformidad:
          type: boolean
          default: true
        motivo_inconformidad:
          type: string
          default: ''

    KPIsResponse:
      type: object
      properties:
        total_cotizaciones:
          type: integer
          example: 12
        total_ordenes:
          type: integer
          example: 9
        servicios_pendientes_facturar:
          type: integer
          example: 0
        cambios_personal_registrados:
          type: integer
          example: 2
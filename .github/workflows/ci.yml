name: CleanPro CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHONPATH: .

jobs:
  pruebas-sqlite:
    name: Pruebas + cobertura (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas unitarias e integración con compuerta de cobertura >= 80%
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  pruebas-postgres:
    name: Pruebas de integración (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cleanpro
          POSTGRES_PASSWORD: cleanpro_ci_pwd
          POSTGRES_DB: cleanpro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanpro -d cleanpro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cleanpro:cleanpro_ci_pwd@localhost:5432/cleanpro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas contra PostgreSQL real
        run: pytest tests/test_api_integration.py -v

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: [pruebas-sqlite, pruebas-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t cleanpro:${{ github.sha }} .

# Entorno reproducible: base de datos PostgreSQL + aplicación + pruebas.
#   docker compose up --build            -> levanta todo (app en http://localhost:8000)
#   docker compose run --rm tests         -> vuelve a correr solo las pruebas
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cleanpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cleanpro_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-cleanpro_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cleanpro}:${POSTGRES_PASSWORD:-cleanpro_dev_pwd}@db:5432/${POSTGRES_DB:-cleanpro_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tests:
    build: .
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cleanpro}:${POSTGRES_PASSWORD:-cleanpro_dev_pwd}@db:5432/cleanpro_test
    command: ["pytest", "--cov=src", "--cov-report=term-missing", "--cov-fail-under=80"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
